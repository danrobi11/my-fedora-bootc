flush ruleset

# Explicitly blocked ports (informational; policy drop handles them)
define BLOCKED_TCP = { 21, 23, 22, 25, 135, 137, 138, 139, 445, 3389, 1433, 3306, 5432, 5900 }
define BLOCKED_UDP = { 69, 135, 137, 138, 161, 162, 445, 1434, 1900, 3389 }

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    # Accept established/related
    ct state established,related accept

    # Accept loopback
    iif "lo" accept

    # Drop invalid
    ct state invalid drop

    # IPv4 ICMP (ping)
    ip protocol icmp icmp type { echo-request, echo-reply } accept

    # IPv6 ICMPv6
    ip6 nexthdr icmpv6 icmpv6 type {
      echo-request,
      echo-reply,
      nd-neighbor-solicit,
      nd-neighbor-advert,
      nd-router-solicit,
      nd-router-advert,
      mld-listener-query,
      mld-listener-report,
      mld-listener-done,
      mld2-listener-report
    } accept

    # === Example: how to open a port ===
    # tcp dport 4001 accept
    # udp dport 4001 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
